<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100" role="img" aria-label="A pixel cat walking across the screen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .walk { animation: walk 10s linear infinite; }
    .fa   { animation: fa 0.4s steps(1) infinite; }
    .fb   { animation: fb 0.4s steps(1) infinite; }
    @keyframes walk {
      from { transform: translateX(-80px); }
      to   { transform: translateX(830px); }
    }
    @keyframes fa { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes fb { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <!-- ground -->
  <rect x="0" y="84" width="800" height="2" fill="#8b949e"/>
  <g fill="#8b949e">
    <rect x="60"  y="90" width="6" height="2"/>
    <rect x="150" y="93" width="4" height="2"/>
    <rect x="260" y="89" width="8" height="2"/>
    <rect x="380" y="92" width="4" height="2"/>
    <rect x="470" y="90" width="6" height="2"/>
    <rect x="590" y="93" width="8" height="2"/>
    <rect x="700" y="89" width="4" height="2"/>
  </g>

  <!-- cat (faces right, walks left to right, loops) -->
  <g class="walk">
    <g transform="translate(0 44)">
      <!-- tail -->
      <rect x="0" y="12" width="4" height="16" fill="#e8a04a"/>
      <rect x="4" y="20" width="4" height="4" fill="#e8a04a"/>
      <!-- body -->
      <rect x="8" y="16" width="40" height="16" fill="#e8a04a"/>
      <rect x="20" y="16" width="4" height="8" fill="#c97a2b"/>
      <rect x="32" y="16" width="4" height="8" fill="#c97a2b"/>
      <!-- head -->
      <rect x="44" y="8" width="16" height="12" fill="#e8a04a"/>
      <rect x="44" y="4" width="4" height="4" fill="#e8a04a"/>
      <rect x="56" y="4" width="4" height="4" fill="#e8a04a"/>
      <rect x="52" y="12" width="4" height="4" fill="#222"/>
      <rect x="60" y="12" width="4" height="4" fill="#f4a6b7"/>

      <!-- legs, frame A -->
      <g class="fa" fill="#c97a2b">
        <rect x="12" y="32" width="4" height="8"/>
        <rect x="32" y="32" width="4" height="8"/>
        <rect x="20" y="32" width="4" height="4"/>
        <rect x="40" y="32" width="4" height="4"/>
      </g>
      <!-- legs, frame B -->
      <g class="fb" fill="#c97a2b">
        <rect x="20" y="32" width="4" height="8"/>
        <rect x="40" y="32" width="4" height="8"/>
        <rect x="12" y="32" width="4" height="4"/>
        <rect x="32" y="32" width="4" height="4"/>
      </g>
    </g>
  </g>
</svg>
